<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowList - Mobile List Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">
                <span class="gradient-text">FlowList</span>
            </h1>
            <div class="stats">
                <span class="stat-item">
                    <span class="stat-number" id="activeCount">0</span>
                    <span class="stat-label">Active</span>
                </span>
                <span class="stat-item">
                    <span class="stat-number" id="completedCount">0</span>
                    <span class="stat-label">Done</span>
                </span>
            </div>
        </header>

        <main class="main-content">
            <div class="input-section">
                <form id="addItemForm" class="add-form">
                    <input 
                        type="text" 
                        id="newItemInput" 
                        class="item-input" 
                        placeholder="Add a new item..."
                        autocomplete="off"
                        maxlength="100"
                    >
                    <button type="submit" class="add-btn" aria-label="Add item">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="itemList" class="item-list">
                <!-- Items will be dynamically added here -->
            </ul>

            <div class="empty-state" id="emptyState">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <p class="empty-text">No items yet. Add your first task!</p>
            </div>
        </main>

        <button class="clear-completed" id="clearCompletedBtn">
            Clear Completed
        </button>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
